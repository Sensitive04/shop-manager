# Netlify deployment.
#
# Netlify builds and serves the Next.js app itself; there is no container and no
# long-lived Node process. Two consequences are handled explicitly:
#
#   1. Netlify Functions have a read-only filesystem. Nothing can be written to
#      disk and read back later, so the database must be external — see
#      MONGODB_URI. This is why data lives in MongoDB Atlas rather than in a local
#      file. `output: 'standalone'` in next.config.ts serves the Docker path and
#      is simply unused here.
#
#   2. Functions scale out horizontally and freeze when idle, so lib/db.ts
#      shrinks the connection pool when it detects this runtime. Without that,
#      concurrent instances would exhaust the database's connection limit.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  # `next build` type-checks and prerenders. The API routes are all dynamic and
  # only touch MongoDB at request time, so no credentials are needed to build —
  # MONGODB_URI must not be set here, and lib/db.ts refuses the in-memory
  # fallback in production. MONGODB_DB_NAME is harmless because it is not secret.
  MONGODB_DB_NAME = "shopmanager"

[functions]
  node_bundler = "esbuild"

  # next.config.ts lists mongoose in serverExternalPackages, so Next.js leaves it
  # as a bare runtime require instead of inlining it. esbuild cannot resolve the
  # MongoDB driver's conditionally-required native add-ons (bson-ext, kerberos),
  # so the package has to be copied into the bundle verbatim rather than bundled.
  # Without this the function builds but fails on the first database call.
  external_node_modules = ["mongoose"]

# Not settable here: function timeout. `[functions]` only accepts directory,
# node_bundler, external_node_modules and included_files — a `timeout` key is a
# hard config-parse error, not a warning. A sale writes several collections in one
# transaction, which is tight against the 10s default on a cold Atlas free
# cluster, so raise it in the Netlify UI instead:
#
#   Site configuration > Functions > Function timeout > 30 seconds
#
# Runtime-only env vars must also be set in that UI, not in [build.environment]
# above, which applies to the build step only:
#
#   MONGODB_URI           fresh Atlas SRV URI with the rotated password
#   MONGODB_DB_NAME       shopmanager
#   NODE_ENV              production
#   TZ                    shop timezone, e.g. Asia/Karachi
#
# TZ matters: lib/dates.ts parses YYYY-MM-DD in local time to keep ledger day
# boundaries aligned with the till, and Netlify Functions default to UTC. Without
# TZ the shop's "today" is wrong for part of every day.
